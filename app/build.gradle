plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jonnysundae.verifiqueosfatos'
    compileSdk 34

    defaultConfig {
        applicationId "com.jonnysundae.verifiqueosfatos"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero dependencias externas para manter o APK ultra-leve (~100 KB), rapido e estavel em Smart TVs e Celulares
}
